<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giỏ hàng | FastFood</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="assets/store.js"></script>

  <style>
    :root {
      --primary-color: #ff5a1f;
      --secondary-color: #e53935;
      --light-bg: #fff8f5;
    }

    body {
      background-color: #fffdfc;
      font-family: Arial, Helvetica, sans-serif;
      color: #444;
    }

    .top-navbar {
      background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
    }

    .brand-logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff !important;
    }

    .brand-logo span {
      color: #ffe082;
    }

    .cart-btn {
      position: relative;
      border-radius: 50px;
    }

    .cart-count {
      position: absolute;
      top: -8px;
      right: -8px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ffd54f;
      color: #000;
      font-size: 12px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .content-card {
      border: none;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      background: #fff;
    }

    .cart-product-image {
      width: 90px;
      height: 70px;
      object-fit: cover;
      border-radius: 12px;
    }

    .option-text {
      font-size: 0.9rem;
      color: #777;
    }

    .qty-control {
      display: inline-flex;
      align-items: center;
      border: 1px solid #ddd;
      border-radius: 999px;
      overflow: hidden;
    }

    .qty-control button {
      width: 38px;
      height: 38px;
      border: none;
      background: #fff;
      font-weight: 700;
    }

    .qty-control input {
      width: 56px;
      height: 38px;
      border: none;
      text-align: center;
      outline: none;
    }

    .summary-card {
      background: var(--light-bg);
      border-radius: 20px;
      border: 1px solid #ffe0d6;
    }

    .btn-main {
      background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
      border: none;
      color: white;
      font-weight: 700;
      border-radius: 999px;
      padding: 12px 20px;
    }

    .btn-main:hover {
      opacity: 0.95;
      color: white;
    }

    .empty-state {
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }
  </style>
</head>
<body>
  <!-- Header -->
  <nav class="navbar navbar-expand-lg top-navbar sticky-top">
    <div class="container py-2">
      <a class="navbar-brand brand-logo" href="index.html">
        <i class="bi bi-bag-heart-fill me-2"></i>Fast<span>Food</span>
      </a>

      <div class="d-flex align-items-center gap-2">
        <a href="index.html" class="btn btn-outline-light rounded-pill px-3">
          <i class="bi bi-house-door-fill me-1"></i> Trang chủ
        </a>

        <a href="cart.html" class="btn btn-light cart-btn px-3">
          <i class="bi bi-cart3 me-1"></i> Giỏ hàng
          <span class="cart-count" data-cart-count>0</span>
        </a>
      </div>
    </div>
  </nav>

  <!-- Nội dung giỏ hàng -->
  <section class="py-5">
    <div class="container">
      <div class="row g-4">
        <!-- Cột trái: bảng giỏ hàng -->
        <div class="col-lg-8">
          <!-- Trạng thái rỗng -->
          <div id="emptyState" class="empty-state p-5 text-center d-none">
            <i class="bi bi-cart-x display-3 text-danger"></i>
            <h3 class="fw-bold mt-3">Giỏ hàng đang trống</h3>
            <p class="text-muted">Bạn chưa chọn món ăn nào. Hãy quay lại trang chủ để tiếp tục mua hàng.</p>
            <a href="index.html" class="btn btn-main mt-2">
              <i class="bi bi-arrow-left-circle me-2"></i>Quay lại thực đơn
            </a>
          </div>

          <!-- Bảng giỏ hàng -->
          <div id="cartTableWrapper" class="content-card p-4">
            <div class="d-flex justify-content-between align-items-center flex-wrap mb-3">
              <h2 class="fw-bold mb-2">Giỏ hàng của bạn</h2>
              <button id="clearCartBtn" class="btn btn-outline-danger rounded-pill">
                <i class="bi bi-trash3 me-1"></i>Xóa toàn bộ
              </button>
            </div>

            <div class="table-responsive">
              <table class="table align-middle">
                <thead>
                  <tr>
                    <th>Sản phẩm</th>
                    <th>Đơn giá</th>
                    <th>Số lượng</th>
                    <th>Thành tiền</th>
                    <th>Xóa</th>
                  </tr>
                </thead>
                <tbody id="cartTableBody">
                  <!-- Dữ liệu render bằng JavaScript -->
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- Cột phải: tổng kết đơn hàng -->
        <div class="col-lg-4">
          <div id="summaryContainer">
            <!-- Summary render bằng JavaScript -->
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  

  <!-- JS dùng chung -->
  <script src="assets/store.js"></script>

  <script>
    /* =========================================================
       cart.html
       - Đọc giỏ hàng từ Local Storage
       - Hiển thị dạng bảng
       - Tăng/giảm số lượng
       - Tính tổng tiền
       - Nút thanh toán mô phỏng Frontend
    ========================================================== */
    document.addEventListener("DOMContentLoaded", () => {
      const loggedInUser = JSON.parse(localStorage.getItem('loggedInUser'));

      if (!loggedInUser) {
        // Nếu chưa đăng nhập, chuyển đến trang đăng nhập
        alert("Bạn cần đăng nhập trước khi vào giỏ hàng.");
        window.location.href = "login.html";
        return;
      }

      const emptyState = document.getElementById("emptyState");
      const cartTableWrapper = document.getElementById("cartTableWrapper");
      const cartTableBody = document.getElementById("cartTableBody");
      const summaryContainer = document.getElementById("summaryContainer");
      const clearCartBtn = document.getElementById("clearCartBtn");

      /* -------------------------------------------------------
         Render toàn bộ trang giỏ hàng
      ------------------------------------------------------- */
      function renderCartPage() {
        const cart = FastFoodStore.getCart();
        const summary = FastFoodStore.getCartSummary();

        FastFoodStore.updateCartBadge();

        // Nếu giỏ hàng trống
        if (!cart.length) {
          emptyState.classList.remove("d-none");
          cartTableWrapper.classList.add("d-none");

          summaryContainer.innerHTML = `
            <div class="summary-card p-4">
              <h4 class="fw-bold mb-3">Tóm tắt đơn hàng</h4>
              <p class="text-muted mb-0">Chưa có sản phẩm nào trong giỏ hàng.</p>
            </div>
          `;
          return;
        }

        // Nếu có sản phẩm
        emptyState.classList.add("d-none");
        cartTableWrapper.classList.remove("d-none");

        cartTableBody.innerHTML = cart.map((item) => `
          <tr>
            <td>
              <div class="d-flex align-items-start gap-3">
                <img
                  src="${item.image}"
                  alt="${item.name}"
                  class="cart-product-image"
                />
                <div>
                  <h6 class="fw-bold mb-1">${item.name}</h6>
                  <div class="option-text">
                    ${FastFoodStore.getSelectedOptionsText(item.selectedOptions)}
                  </div>
                </div>
              </div>
            </td>

            <td class="fw-semibold">
              ${FastFoodStore.formatPrice(FastFoodStore.getUnitPrice(item))}
            </td>

            <td>
              <div class="qty-control">
                <button
                  type="button"
                  data-action="decrease"
                  data-id="${item.cartItemId}"
                >-</button>

                <input
                  type="number"
                  min="1"
                  value="${item.quantity}"
                  data-qty-input
                  data-id="${item.cartItemId}"
                />

                <button
                  type="button"
                  data-action="increase"
                  data-id="${item.cartItemId}"
                >+</button>
              </div>
            </td>

            <td class="fw-bold text-danger">
              ${FastFoodStore.formatPrice(FastFoodStore.getItemSubtotal(item))}
            </td>

            <td>
              <button
                class="btn btn-sm btn-outline-danger rounded-pill"
                type="button"
                data-action="remove"
                data-id="${item.cartItemId}"
              >
                <i class="bi bi-trash3"></i>
              </button>
            </td>
          </tr>
        `).join("");

        summaryContainer.innerHTML = `
          <div class="summary-card p-4">
            <h4 class="fw-bold mb-4">Tóm tắt đơn hàng</h4>

            <div class="d-flex justify-content-between mb-2">
              <span>Tổng số lượng:</span>
              <span>${summary.totalQuantity}</span>
            </div>

            <div class="d-flex justify-content-between mb-2">
              <span>Tạm tính:</span>
              <span>${FastFoodStore.formatPrice(summary.totalPrice)}</span>
            </div>

            <div class="d-flex justify-content-between mb-2">
              <span>Phí giao hàng:</span>
              <span>Miễn phí (demo)</span>
            </div>

            <hr />

            <div class="d-flex justify-content-between fw-bold fs-5 mb-4">
              <span>Tổng thanh toán:</span>
              <span class="text-danger">${FastFoodStore.formatPrice(summary.totalPrice)}</span>
            </div>

            <button id="checkoutBtn" class="btn btn-main w-100 mb-2">
              <i class="bi bi-credit-card-fill me-2"></i>Thanh toán
            </button>

            <p class="small text-muted mb-0">
              Chức năng thanh toán ở đây là mô phỏng phía Frontend, dữ liệu hiện được lưu tạm bằng Local Storage.
            </p>
          </div>
        `;

        const checkoutBtn = document.getElementById("checkoutBtn");
        if (checkoutBtn) {
          checkoutBtn.addEventListener("click", () => {
            alert(
              "Đây là phiên bản Frontend demo. Dữ liệu giỏ hàng hiện được lưu bằng Local Storage, chưa kết nối Backend để xử lý thanh toán thực tế."
            );
          });
        }
      }

      /* -------------------------------------------------------
         Xử lý tăng/giảm/xóa sản phẩm trong giỏ
      ------------------------------------------------------- */
      cartTableBody.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-action]");
        if (!button) return;

        const action = button.dataset.action;
        const cartItemId = button.dataset.id;
        const cart = FastFoodStore.getCart();
        const currentItem = cart.find((item) => item.cartItemId === cartItemId);

        if (!currentItem) return;

        if (action === "increase") {
          FastFoodStore.updateItemQuantity(cartItemId, currentItem.quantity + 1);
        }

        if (action === "decrease") {
          FastFoodStore.updateItemQuantity(cartItemId, currentItem.quantity - 1);
        }

        if (action === "remove") {
          FastFoodStore.removeItem(cartItemId);
        }

        renderCartPage();
      });

      /* -------------------------------------------------------
         Cho phép nhập trực tiếp số lượng
      ------------------------------------------------------- */
      cartTableBody.addEventListener("change", (event) => {
        const input = event.target.closest("input[data-qty-input]");
        if (!input) return;

        const cartItemId = input.dataset.id;
        const nextQuantity = Math.max(1, Number(input.value) || 1);

        FastFoodStore.updateItemQuantity(cartItemId, nextQuantity);
        renderCartPage();
      });

      /* -------------------------------------------------------
         Xóa toàn bộ giỏ hàng
      ------------------------------------------------------- */
      clearCartBtn.addEventListener("click", () => {
        FastFoodStore.clearCart();
        renderCartPage();
      });

      renderCartPage();
    });
  </script>
</body>
</html>
