<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng Nhập | FastFood</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #fffdfc;
    }
    .container {
      max-width: 500px;
      margin-top: 50px;
    }
    .btn-custom {
      background-color: #ff5a1f;
      color: #fff;
      width: 100%;
    }
    .btn-custom:hover {
      background-color: #e53935;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="text-center mb-4">Đăng Nhập</h2>
    <form id="loginForm">
      <div class="mb-3">
        <label for="loginUsername" class="form-label">Tên đăng nhập</label>
        <input type="text" class="form-control" id="loginUsername" required />
      </div>
      <div class="mb-3">
        <label for="loginPassword" class="form-label">Mật khẩu</label>
        <input type="password" class="form-control" id="loginPassword" required />
      </div>
      <button type="submit" class="btn btn-custom">Đăng Nhập</button>
    </form>
    <div class="mt-3 text-center">
      <p>Chưa có tài khoản? <a href="signup.html">Đăng ký</a></p>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function (event) {
      event.preventDefault();

      const username = document.getElementById('loginUsername').value;
      const password = document.getElementById('loginPassword').value;

      // Kiểm tra thông tin đăng nhập
      const storedUser = JSON.parse(localStorage.getItem('user'));

      if (storedUser && storedUser.username === username && storedUser.password === password) {
        // Lưu thông tin đăng nhập vào LocalStorage
        localStorage.setItem('loggedInUser', JSON.stringify(storedUser));
        alert('Đăng nhập thành công!');
        window.location.href = 'index.html'; // Quay lại trang chủ
      } else {
        alert('Sai tên đăng nhập hoặc mật khẩu!');
      }
    });
  </script>
</body>
</html>
